 else if(a==='down'){if(G.pow.plane>0)return;if(!G.grounded)G.vy=-30;G.rollT=0.75;SFX.roll();}}
function stumble(){SFX.stumble();G.shake=0.3;if(G.chaseT>0){gameOver(tr('caught'));return;}G.chaseT=6;toast(tr('careful'));setTimeout(SFX.bark,150);}
function crash(){if(G.invul>0)return;if(G.board>0){G.board=0;G.invul=2;hero.board.visible=false;G.shake=0.4;SFX.hit();burst(G.x,G.y+0.4,G.pz,18,0x33ffee,5,0.5);toast(tr('saved'));return;}gameOver(tr('bam'));}
function gameOver(title){G.state='over';G.overT=0;G.shake=0.5;SFX.hit();SFX.over();setTimeout(SFX.bark,400);plane.visible=false;stopEngine();
 const s=Math.floor(G.score),c=Math.floor(G.coins);save.coins+=c;const rec=s>save.best;if(rec)save.best=s;store();
 $('overTitle').textContent=rec?tr('record'):title;$('finalScore').textContent=s;$('finalCoins').textContent='+'+c;$('finalBest').textContent=save.best;
 setTimeout(()=>{if(G.state==='over'){$('hud').classList.add('hidden');$('over').classList.remove('hidden');}},1500);}
function usePow(k){G.pow[k]=powDur(k);SFX.power();toast(POW[k].icon+' '+tr('p_'+k));burst(G.x,G.y+1,G.pz-0.5,22,new THREE.Color(POW[k].c).getHex(),6,0.55);if(k==='plane')usePlaneFx();}
function useBoard(){if(G.state!=='play'||G.board>0||save.boards<=0)return;save.boards--;store();G.board=30;hero.board.visible=true;toast('🛹 '+tr('boardOn'));SFX.board();burst(G.x,0.3,G.pz,16,0x33ffee,4,0.45);}
function checkHits(){if(G.pow.plane>0||G.invul>0)return;const h=G.rollT>0?0.8:1.8;
 for(const o of objs){if(Math.abs(o.x-G.x)>1.25||G.pz>o.z0+0.35||G.pz<o.z1-0.35)continue;
  if(o.type==='train'){if(G.y<o.top-0.45){crash();return;}}else if(o.type==='hurdle'){if(G.y<o.top-0.05){crash();return;}}else if(o.type==='high'){if(G.y+h>o.bot&&G.y<o.top){crash();return;}}}}
const V=new THREE.Vector3();
function step(s){const ch=CHARS[save.char];
 G.speed=Math.min(36,15+G.dist/150);G.pz-=G.speed*s;G.dist+=G.speed*s;
 G.sm=(G.pow.x2>0?2:1)*(G.run.s2?2:1)*(ch.perk==='score'?1.3:1);G.cm=(G.pow.c2>0?2:1)*(G.run.c2?2:1)*(ch.perk==='coins'?1.25:1);G.score+=G.speed*s*0.5*G.sm;
 for(const k of POW_KEYS)if(G.pow[k]>0){G.pow[k]-=s;if(G.pow[k]<=0){G.pow[k]=0;if(k==='plane'){plane.visible=false;G.invul=Math.max(G.invul,1.6);G.vy=0;stopEngine();}}}
 if(G.board>0){G.board-=s;if(G.board<=0){G.board=0;hero.board.visible=false;}}
 G.invul-=s;G.chaseT-=s;G.introT-=s;G.comboT-=s;if(G.comboT<=0)G.combo=0;if(G.rollT>0)G.rollT-=s;
 G.x=lerp(G.x,LANES[G.lane],Math.min(1,s*14));
 if(G.pow.plane>0){G.y=lerp(G.y,6.3,Math.min(1,s*3));G.vy=0;G.grounded=false;}
 else{const wasAir=!G.grounded,vy0=G.vy;G.vy-=(G.vy<0?44:38)*s;G.y+=G.vy*s;checkHits();if(G.state!=='play')return;const f=floorAt(G.x,G.pz);
  if(G.y<=f){if(f-G.y<0.8||G.vy<-0.1&&G.y>f-1.2){G.y=f;G.vy=0;G.grounded=true;if(wasAir&&vy0<-8){SFX.land();burst(G.x,f+0.1,G.pz,5,0xddccaa,2,0.3);}}else if(G.y<0){G.y=0;G.vy=0;G.grounded=true;}}else if(G.y>f+0.08)G.grounded=false;}
 const cx=G.x,cy=G.y+0.9,mag=G.pow.magnet>0;
 for(let i=coinsA.length-1;i>=0;i--){const c=coinsA[i],p=c.m.position;
  if(mag&&Math.abs(p.z-G.pz)<10&&Math.abs(p.x-cx)<7.5){V.set(cx,cy,G.pz);p.lerp(V,Math.min(1,s*10));}
  const dx=p.x-cx,dy=p.y-cy,dz=p.z-G.pz;if(dx*dx+dy*dy+dz*dz<(mag?1.7:1.2)){scene.remove(c.m);coinsA.splice(i,1);G.coins+=G.cm;G.score+=5*G.sm;G.combo++;G.comboT=0.6;SFX.coin(G.combo-1);burst(p.x,p.y,p.z,4,G.cm>1.5?0x8aff6a:0xffe066,2.5,0.35);}}
 for(let i=powsA.length-1;i>=0;i--){const p=powsA[i];const dx=p.x-cx,dy=p.m.position.y-cy,dz=p.z-G.pz;if(dx*dx+dy*dy+dz*dz<2){scene.remove(p.m);powsA.splice(i,1);usePow(p.k);}}
 if(G.pow.plane>0){G.trailT-=s;if(G.trailT<=0){G.trailT=0.05;burst(G.x,G.y+0.4,G.pz+1.6,1,0xffffff,0.6,0.7);}}}
const camT=new THREE.Vector3(),lookT=new THREE.Vector3(),lookC=new THREE.Vector3(0,1.4,-6);
function updCamera(dt){const port=innerWidth<innerHeight;
 if(G.state==='menu'){camT.set(0,port?2.6:2.1,G.pz+(port?6.6:5.6));lookT.set(0,port?1.7:1.45,G.pz);}
 else{const fly=G.pow.plane>0;camT.set(G.x*0.75,fly?G.y+3.4:G.y*0.75+4.3,G.pz+(fly?9:7.6));lookT.set(G.x*0.6,fly?G.y:G.y*0.6+1.3,G.pz-7);}
 const k=Math.min(1,dt*(G.state==='menu'?3:7));camera.position.lerp(camT,k);lookC.lerp(lookT,k);
 if(G.shake>0){G.shake-=dt;camera.position.x+=(Math.random()-.5)*G.shake;camera.position.y+=(Math.random()-.5)*G.shake;}
 camera.lookAt(lookC);sun.position.set(G.x+9,26,G.pz+8);sun.target.position.set(G.x,0,G.pz-10);}
function animate(dt){const tx=LANES[G.lane],r=hero.root;
 if(G.state==='menu'){r.position.set(0,0,G.pz);r.rotation.set(0,Math.PI+Math.sin(G.t*0.8)*0.3,0);G.cheerT-=dt;animRunner(hero,dt,G.cheerT>0?'cheer':'wave');
  guard.root.visible=dog.root.visible=true;guard.root.position.set(-2.4,0,G.pz-3.5);guard.root.rotation.set(0,Math.PI*0.85,0);animRunner(guard,dt,'idle');dog.root.position.set(2.3,0,G.pz-2.8);dog.root.rotation.set(0,-Math.PI*0.8,0);dog.t+=dt;dog.tail.rotation.z=Math.sin(dog.t*20)*0.8;dog.head.rotation.z=Math.sin(dog.t*2)*0.2;for(const L of dog.legs)L.rotation.x=0;}
 else{r.position.set(G.x,G.y,G.pz);r.rotation.set(0,(G.x-tx)*0.2,(G.x-tx)*0.06);
  let mode='run';if(G.state==='over')mode='fall';else if(G.pow.plane>0)mode='plane';else if(G.rollT>0)mode='roll';else if(!G.grounded)mode='jump';else if(G.board>0)mode='board';
  animRunner(hero,G.state==='over'?0:dt,mode,G.speed/15);if(G.board>0&&mode!=='plane')hero.body.position.y+=0.16;
  r.visible=!(G.invul>0&&G.state==='play'&&Math.floor(G.t*14)%2);
  if(plane.visible){plane.position.set(G.x,G.y+0.42,G.pz-0.1);plane.rotation.set(Math.sin(G.t*2)*0.04,0,(G.x-tx)*0.25);plane.userData.prop.rotation.z+=dt*40;}
  const target=G.state==='over'?1.0:(G.chaseT>0||G.introT>0)?2.4:17;G.chaseD=lerp(G.chaseD,target,Math.min(1,dt*(G.state==='over'?3:1.2)));
  const vis=G.chaseD<15;guard.root.visible=dog.root.visible=vis;guard.root.rotation.set(0,0,0);dog.root.rotation.set(0,0,0);
  if(vis){chase.gx=lerp(chase.gx,G.x,Math.min(1,dt*4));const gz=G.pz+G.chaseD;chase.gy=lerp(chase.gy,floorAt(chase.gx,gz),Math.min(1,dt*10));chase.dy=lerp(chase.dy,floorAt(chase.gx+0.9,gz-0.9),Math.min(1,dt*10));
   guard.root.position.set(chase.gx-0.35,chase.gy,gz);dog.root.position.set(chase.gx+0.85,chase.dy,gz-0.9);const ov=G.state==='over'&&G.chaseD<1.3;animRunner(guard,dt,ov?'wave':'run',ov?1:G.speed/16);if(!ov)animDog(dog,dt);}}
 for(const c of coinsA)c.m.rotation.y+=dt*4;
 for(const p of powsA){const u=p.m.userData;u.spin.rotation.y+=dt*2.2;p.m.position.y=p.y+Math.sin(G.t*4+p.z)*0.15;u.ring.scale.setScalar(1+Math.sin(G.t*6)*0.08);if(u.prop)u.prop.rotation.z+=dt*30;}
 updParts(dt);}
let hudT=0;
function updateHUD(dt){hudT-=dt;if(hudT>0)return;hudT=0.1;$('score').textContent=Math.floor(G.score);$('coins').textContent=Math.floor(G.coins);$('mult').textContent='x'+(Math.round(G.sm*10)/10);
 let h='';for(const k of POW_KEYS)if(G.pow[k]>0)h+='<div class="pw" style="--c:'+POW[k].c+'"><div class="ic">'+POW[k].icon+'</div><div class="bar"><i style="width:'+(100*G.pow[k]/powDur(k))+'%"></i></div></div>';
 if(G.board>0)h+='<div class="pw" style="--c:#33ffee"><div class="ic">🛹</div><div class="bar"><i style="width:'+(100*G.board/30)+'%"></i></div></div>';
 if(G.run.c2)h+='<div class="pw" style="--c:#3fd65a"><div class="ic">💰</div>x2</div>';if(G.run.s2)h+='<div class="pw" style="--c:#f0307e"><div class="ic">⭐</div>x2</div>';
 $('pows').innerHTML=h;$('boardN').textContent=save.boards;$('boardBtn').classList.toggle('on',G.board>0);
 const cb=$('combo');if(G.combo>=5){cb.textContent=tr('combo')+' x'+G.combo;cb.style.opacity=1;}else cb.style.opacity=0;}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(0.05,(now-last)/1000);last=now;G.t+=dt;
 if(G.state==='play'){let rem=dt;while(rem>1e-4&&G.state==='play'){const s=Math.min(0.016,rem);step(s);rem-=s;}updateWorld(G.pz,G.speed);updateHUD(dt);}
 else if(G.state==='over')G.overT+=dt;
 if(G.state!=='pause'){animate(dt);updCamera(dt);}renderer.render(scene,camera);}
// ---------- UI ----------
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('show'),1300);}
function hint(t,s){const e=$('hint');e.textContent=t;clearTimeout(hint.h);hint.h=setTimeout(()=>e.textContent='',s*1000);}
const PANELS=['menu','hud','shop','settings','pause','over'];
function hideAll(){for(const id of PANELS)$(id).classList.add('hidden');}
function showHUD(){hideAll();$('hud').classList.remove('hidden');hudT=0;updateHUD(1);}
let viewChar=save.char;
function showMenu(){hideAll();stopEngine();Object.assign(G,{state:'menu',pz:0,x:0,y:0,lane:1,speed:15});for(const k of POW_KEYS)G.pow[k]=0;resetWorld();updateWorld(0,15);plane.visible=false;viewChar=save.char;buildHero(viewChar);hero.root.visible=true;refreshMenu();$('menu').classList.remove('hidden');}
const coinH='<span class="coin-i"></span>';
const BOOST_PRICE={bc2:400,bs2:400,bstart:600,board:300},BOOST_ICON={bc2:'💰',bs2:'⭐',bstart:'✈️',board:'🛹'},BOOST_C={bc2:'#3fd65a',bs2:'#f0307e',bstart:'#4ab0ff',board:'#33d6e6'},BOOST_TAG={bc2:'x2',bs2:'x2',bstart:'START',board:''};
function refreshMenu(){$('bank').textContent=save.coins;$('bestM').textContent=save.best;const c=CHARS[viewChar],own=save.owned.includes(viewChar),L=save.lang;
 $('charName').textContent=(own?'':'🔒 ')+c.n[L];$('charPerk').textContent=c.d[L]+' · '+c.p[L];
 $('playBtn').textContent=tr('play');$('playBtn').classList.toggle('hidden',!own);const b=$('buyC');b.classList.toggle('hidden',own);b.innerHTML=coinH+' '+c.price;b.disabled=save.coins<c.price;
 let h='';for(const k of['bc2','bs2','bstart']){const n=save.boosts[k];h+='<button class="chip'+(save.sel[k]&&n>0?' on':'')+'" data-b="'+k+'" title="'+tr('b_'+k)+'" '+(n>0?'':'disabled')+'>'+BOOST_ICON[k]+' '+BOOST_TAG[k]+' <b>'+n+'</b></button>';}
 h+='<button class="chip" disabled title="'+tr('b_board')+'">🛹 <b>'+save.boards+'</b></button>';$('boostBar').innerHTML=h;}
$('boostBar').onclick=e=>{const b=e.target.closest('[data-b]');if(!b||b.disabled)return;const k=b.dataset.b;save.sel[k]=!save.sel[k];store();SFX.click();refreshMenu();};
function switchChar(d){viewChar=(viewChar+d+CHARS.length)%CHARS.length;if(save.owned.includes(viewChar)){save.char=viewChar;store();}buildHero(viewChar);G.cheerT=0.9;SFX.click();refreshMenu();}
$('prevC').onclick=()=>switchChar(-1);$('nextC').onclick=()=>switchChar(1);
$('buyC').onclick=()=>{const c=CHARS[viewChar];if(save.coins<c.price){toast(tr('notEnough'));return;}save.coins-=c.price;save.owned.push(viewChar);save.char=viewChar;store();SFX.buy();toast(tr('newHero'));G.cheerT=1.6;burst(0,1.6,0.5,40,0xffe066,6,0.5);refreshMenu();};
let shopTab='up';
function pips(lv){let s='<div class="pips">';for(let i=0;i<5;i++)s+='<i class="'+(i<lv?'f':'')+'"></i>';return s+'</div>';}
const UPC=[250,500,1000,2000,4000];
function renderShop(){$('bank2').textContent=save.coins;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===shopTab));let h='';
 if(shopTab==='up'){for(const k of POW_KEYS){const lv=save.up[k],cost=UPC[lv],p=POW[k];
  h+='<div class="sc" style="--c:'+p.c+'"><div class="ico">'+p.icon+'</div><b>'+tr('p_'+k)+'</b><small>'+tr('d_'+k)+'<br>⏱ '+powDur(k)+' '+tr('sec')+'</small>'+pips(lv)+
  (lv>=5?'<button class="btn" disabled>'+tr('max')+'</button>':'<button class="btn green" data-up="'+k+'">'+coinH+' '+cost+'</button>')+'</div>';}}
 else{for(const k of['bc2','bs2','bstart','board']){const n=k==='board'?save.boards:save.boosts[k];

 $('shopGrid').innerHTML=h;}
$('shopGrid').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;let cost=0;

 else if(b.dataset.bb){const k=b.dataset.bb;cost=BOOST_PRICE[k];if(save.coins<cost){toast(tr('notEnough'));SFX.stumble();return;}save.coins-=cost;if(k==='board')save.boards++;else save.boosts[k]++;}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{shopTab=t.dataset.tab;SFX.click();renderShop();});

const KEYS={arrowleft:'left',a:'left','ф':'left',arrowright:'right',d:'right','в':'right',arrowup:'up',w:'up','ц':'up',' ':'up',arrowdown:'down',s:'down','ы':'down','і':'down'};
function modalOpen(){return['shop','settings','pause','over'].some(id=>!$(id).classList.contains('hidden'));}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
 if(KEYS[k]){e.preventDefault();if(e.repeat)return;if(G.state==='play')act(KEYS[k]);else if(G.state==='menu'&&!modalOpen()){if(k==='arrowleft'||k==='a')switchChar(-1);else if(k==='arrowright'||k==='d')switchChar(1);else if(k===' '&&save.owned.includes(viewChar))startRun();}return;}

 else if(k==='enter'){if(G.state==='menu'&&!modalOpen()&&save.owned.includes(viewChar))startRun();else if(G.state==='over'&&!$('over').classList.contains('hidden')&&$('shop').classList.contains('hidden'))startRun();}});
let sw=null,lastTap=0;
renderer.domElement.addEventListener('pointerdown',e=>{sw={x:e.clientX,y:e.clientY,done:false};});
addEventListener('pointermove',e=>{if(!sw||sw.done)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;if(Math.max(Math.abs(dx),Math.abs(dy))>26){sw.done=true;const dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');if(G.state==='play')act(dir);else if(G.state==='menu'&&!modalOpen()&&(dir==='left'||dir==='right'))switchChar(dir==='left'?1:-1);}});
addEventListener('pointerup',()=>{if(sw&&!sw.done&&G.state==='play'){const n=performance.now();if(n-lastTap<320)useBoard();lastTap=n;}sw=null;});

applyI18n();applyQuality();camera.position.set(0,2.2,5.6);showMenu();$('loading').classList.add('hidden');requestAnimationFrame(loop);
